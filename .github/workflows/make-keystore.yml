name: Make Keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore zrc.jks -alias zrc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zrc123456 -keypass zrc123456 \
            -dname "CN=ZRC Translation, OU=Personal, O=ZRC, L=Beijing, ST=Beijing, C=CN"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: zrc-keystore
          path: zrc.jks
          retention-days: 1
